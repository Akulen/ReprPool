[project]
authors = [{name = "Akulen", email = "tomas@rigaux.com"}]
name = "GGNN"
requires-python = ">= 3.15"
version = "0.1.0"
dependencies = ["jax[cuda13]>=0.12.0,<0.13", "equinox>=0.13.8,<0.14", "optax>=0.2.8,<0.3", "torch-geometric>=2.8.1,<3", "torch"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/dglteam/label/cu133"]
platforms = [{ platform = "linux-64", cuda = "13" }]

[tool.pixi.pypi-dependencies]
ggnn = { path = ".", editable = true }

[tool.pixi.tasks]
exp = { cmd = "ipython -m experiments.main --", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform", PYTHONWARNINGS = "ignore:pkg_resources is deprecated:UserWarning" } }
auto_node = { cmd = "ipython -m experiments.auto_node --", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform", PYTHONWARNINGS = "ignore:pkg_resources is deprecated:UserWarning" } }
plot = { cmd = "python -m experiments.plot", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform", PYTHONWARNINGS = "ignore:pkg_resources is deprecated:UserWarning" } }

[tool.pixi.dependencies]
ipython = ">=9.17.1,<10"
matplotlib = ">=3.11.2,<4"
pyyaml = ">=6.0.3,<7"
nvidia-ml-py = ">=13.615.71,<14"
tqdm = ">=4.70.1,<5"
cudnn = ">=9.27.0.42,<10"
setuptools = ">=84.2.0,<85"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
