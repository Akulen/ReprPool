[project]
authors = [{name = "Akulen", email = "tomas@rigaux.com"}]
dependencies = ["torch-geometric>=2.7.0,<3"]
name = "GGNN"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ggnn = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.dependencies]
matplotlib = ">=3.10.8,<4"
jax = ">=0.7.2,<0.8"
jaxlib = { version = ">=0.7.2,<0.8", build = "*cuda*" }
ipython = ">=9.8.0,<10"
jaxtyping = ">=0.3.4,<0.4"
equinox = ">=0.13.2,<0.14"
optax = ">=0.2.6,<0.3"
ogb = ">=1.3.6,<2"

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
