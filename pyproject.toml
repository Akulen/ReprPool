[project]
authors = [{name = "Akulen", email = "tomas@rigaux.com"}]
dependencies = ["torch-geometric>=2.7.0,<3", "yfiles-jupyter-graphs>=1.10.9,<2"]
name = "GGNN"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/dglteam/label/th21_cu121"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ggnn = { path = ".", editable = true }

[tool.pixi.tasks]
exp = { cmd = "ipython -m experiments.main --", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform" } }
auto_node = { cmd = "ipython -m experiments.auto_node --", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform" } }
plot = { cmd = "python -m experiments.plot", env = { XLA_PYTHON_CLIENT_ALLOCATOR = "platform" } }

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.dependencies]
matplotlib = ">=3.10.8,<4"
jax = ">=0.7.2,<0.8"
jaxlib = { version = ">=0.7.2,<0.8", build = "*cuda*" }
ipython = ">=9.8.0,<10"
jaxtyping = ">=0.3.4,<0.4"
equinox = ">=0.13.2,<0.14"
optax = ">=0.2.6,<0.3"
ogb = ">=1.3.6,<2"
pyyaml = ">=6.0.3,<7"
nvidia-ml-py = ">=13.590.44,<14"
jupyter = ">=1.1.1,<2"
distinctipy = ">=1.3.4,<2"
dgl = { version = ">=2.4.0.th21.cu121,<3", channel = "dglteam/label/th21_cu121" }
seaborn = ">=0.13.2,<0.14"
optuna = ">=4.7.0,<5"

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
